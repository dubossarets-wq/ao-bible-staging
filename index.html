443\u043A\u0432\u0430\u043C\u0438."),C("\u0418\u043B\u043B\u044E\u0441\u0442\u0440\u0430\u0446\u0438\u0438, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u044B \u0443\u0436\u0435 \u043E\u0442\u043A\u0440\u044B\u0432\u0430\u043B\u0438, \u043F\u043E\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0438 \u0431\u0435\u0437 \u0438\u043D\u0442\u0435\u0440\u043D\u0435\u0442\u0430 (\u0445\u0440\u0430\u043D\u044F\u0442\u0441\u044F \u043F\u043E\u0441\u043B\u0435\u0434\u043D\u0438\u0435 120)."),C("\u041D\u0430\u0436\u0430\u0442\u0438\u0435 \u043D\u0430 \u043D\u043E\u043C\u0435\u0440 \u0441\u0442\u0438\u0445\u0430 \u0432\u044B\u0434\u0435\u043B\u044F\u0435\u0442 \u0441\u0442\u0438\u0445 \u2014 \u0442\u0435 \u0436\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u044F, \u0447\u0442\u043E \u0438 \u043F\u0440\u0438 \u0434\u043E\u043B\u0433\u043E\u043C \u043D\u0430\u0436\u0430\u0442\u0438\u0438."),C("\u041A\u043D\u043E\u043F\u043A\u0430 \xAB\u041D\u0430\u0437\u0430\u0434\xBB \u043D\u0430 Android \u0437\u0430\u043A\u0440\u044B\u0432\u0430\u0435\u0442 \u043E\u0442\u043A\u0440\u044B\u0442\u043E\u0435 \u043E\u043A\u043D\u043E, \u0430 \u043D\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u0435."),C("\u0411\u043B\u0435\u0434\u043D\u044B\u0439 \u0442\u0435\u043A\u0441\u0442 \u0441\u0442\u0430\u043B \u0442\u0435\u043C\u043D\u0435\u0435 \u0438 \u043B\u0443\u0447\u0448\u0435 \u0447\u0438\u0442\u0430\u0435\u0442\u0441\u044F; \u043D\u043E\u043C\u0435\u0440 \u0441\u0442\u0438\u0445\u0430 \u0438 \u043A\u043D\u043E\u043F\u043A\u0438 \u043F\u0430\u043D\u0435\u043B\u0438 \u043B\u0435\u0433\u0447\u0435 \u043D\u0430\u0436\u0438\u043C\u0430\u0442\u044C."),C("\u0412\u0441\u0435 \u043C\u0435\u0441\u0442\u0430 \u0441\u043B\u043E\u0432\u0430 \u043E\u0440\u0438\u0433\u0438\u043D\u0430\u043B\u0430: \u0432 \u0441\u0442\u0430\u0442\u044C\u0435 \u0421\u0442\u0440\u043E\u043D\u0433\u0430 \u043A\u043D\u043E\u043F\u043A\u0430 \xAB\u0412\u0441\u0435 \u043C\u0435\u0441\u0442\u0430\xBB
